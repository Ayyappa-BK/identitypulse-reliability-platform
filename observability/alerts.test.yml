rule_files: [alerts.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="identitypulse"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: IdentityPulseTargetDown
        exp_alerts:
          - exp_labels: {job: identitypulse, severity: page}
            exp_annotations:
              summary: Authentication telemetry target unavailable or missing
