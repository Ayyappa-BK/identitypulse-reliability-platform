name: Release image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B verify
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ayyappa-bk/identitypulse-reliability-platform:${{ github.sha }}
          provenance: true
          sbom: true
