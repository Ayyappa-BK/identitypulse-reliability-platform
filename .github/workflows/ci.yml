name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-evidence
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
        with: {version: v3.19.0}
      - run: helm lint deploy/helm/identitypulse --strict
      - run: helm template identitypulse deploy/helm/identitypulse --namespace identitypulse > /tmp/rendered.yaml && diff -u deploy/kubernetes/identitypulse.yaml /tmp/rendered.yaml
      - run: docker run --rm -v "$PWD/observability:/etc/prometheus" --entrypoint promtool prom/prometheus:v3.5.0 check rules /etc/prometheus/alerts.yml /etc/prometheus/synthetic-alerts.yml
      - run: docker run --rm -v "$PWD/observability:/etc/prometheus" -w /etc/prometheus --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts.test.yml
      - run: sh scripts/lab-up.sh
      - name: Load, deny, crash, dependency, latency and recovery assertions
        run: |
          export TOKEN="$(python3 scripts/token.py)"
          python3 scripts/load.py --requests 500 --concurrency 8 --output results/baseline.json
          TOKEN="$(python3 scripts/token.py --invalid)" python3 scripts/load.py --requests 20 --expect 401 --output results/invalid.json
          for scenario in crash database redis latency; do
            python3 scripts/failure-test.py "$scenario"
            python3 scripts/incident-report.py "results/failure-$scenario.json" --output "results/incident-$scenario.json"
          done
          python3 scripts/load.py --requests 500 --concurrency 8 --output results/recovered.json
      - name: Save lab logs
        if: always()
        run: docker compose logs --no-color > results/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: reliability-evidence, path: results/}
      - run: docker compose down -v
        if: always()
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B package -DskipTests
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python scripts/security-check.py
