replicaCount: 3
image:
  repository: ghcr.io/ayyappa-bk/identitypulse-reliability-platform
  tag: '1.0.0'
  pullPolicy: IfNotPresent
existingSecret: identitypulse-secrets
issuer: https://issuer.example.invalid
jwksUri: https://issuer.example.invalid/.well-known/jwks.json
redisHost: redis.identitypulse.svc.cluster.local
otelEndpoint: http://otel-collector.observability.svc.cluster.local:4318/v1/traces
resources:
  requests: {cpu: 250m, memory: 384Mi}
  limits: {cpu: '1', memory: 768Mi}
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 60
networkPolicy:
  enabled: true
